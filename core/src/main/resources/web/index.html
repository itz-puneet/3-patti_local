<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3 Patti Chips">
<title>3 Patti Chips Handler</title>
<link rel="icon" href="data:,">
<style>
:root {
  --primary: #1B6B45; --on-primary: #fff; --primary-c: #B7F0CF; --on-primary-c: #002112;
  --secondary: #8A5A00; --on-secondary: #fff; --secondary-c: #FFDDB0; --on-secondary-c: #2C1700;
  --tertiary-c: #BFE9F8; --on-tertiary-c: #001F27;
  --bg: #F5FBF5; --text: #171D19; --muted: #404943; --outline: #C0C9C1;
  --card: #EFF5EF; --card-2: #E4EAE4; --panel: #E9EFE9; --variant: #DCE5DC;
  --error: #BA1A1A; --error-c: #FFDAD6; --on-error-c: #410002;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #8BD8AE; --on-primary: #003920; --primary-c: #005231; --on-primary-c: #A6F4C9;
    --secondary: #FFB950; --on-secondary: #482A00; --secondary-c: #673F00; --on-secondary-c: #FFDDB0;
    --tertiary-c: #214C58; --on-tertiary-c: #BFE9F8;
    --bg: #0F1511; --text: #DEE4DE; --muted: #C0C9C1; --outline: #404943;
    --card: #171D19; --card-2: #252B27; --panel: #1B211D; --variant: #404943;
    --error: #FFB4AB; --error-c: #93000A; --on-error-c: #FFDAD6;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
}
button { font: inherit; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .4; cursor: default; }
input { font: inherit; font-size: 16px; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; }
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#app > .wrap:first-child { flex: 1; display: flex; flex-direction: column; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.sig { font-size: 12px; color: var(--muted); letter-spacing: .04em; opacity: .8; margin-top: 12px; }
.bold { font-weight: 700; }

/* Join screen */
.join { padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.fan { position: relative; width: 150px; height: 104px; margin-bottom: 8px; }
.pc { position: absolute; left: 47px; top: 12px; width: 56px; height: 80px; background: #fff; border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); transform-origin: 50% 100%; padding: 4px 6px; color: #1B1B1B; font-weight: 700; }
.pc span { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-size: 26px; font-weight: 400; }
.pc.red { color: #C62828; }
h1 { margin: 0; font-size: 26px; }
.field { width: 100%; border: 1px solid var(--outline); background: transparent; color: var(--text);
  border-radius: 8px; padding: 14px; }
.field:focus { outline: 2px solid var(--primary); border-color: transparent; }
.btn { background: var(--primary); color: var(--on-primary); border-radius: 26px; padding: 14px 18px; font-weight: 600; width: 100%; }
.btn.alt { background: var(--secondary); color: var(--on-secondary); }
.btn.line { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn.danger { background: transparent; color: var(--error); border: 1px solid var(--outline); }
.btn.big { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.btn.big b { font-size: 18px; }
.btn.slim { padding: 11px 6px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }

/* Game */
header { padding: 12px 16px 8px; padding-top: max(12px, env(safe-area-inset-top)); }
header .title { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { background: var(--error-c); color: var(--on-error-c); padding: 8px 16px; font-size: 14px; }
.tabs { display: flex; border-bottom: 1px solid var(--outline); }
.tabs button { flex: 1; background: transparent; color: var(--muted); padding: 12px 0; font-weight: 600; border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; }
.pot { background: var(--primary-c); color: var(--on-primary-c); text-align: center; padding: 16px; }
.pot .label { font-size: 12px; letter-spacing: 1.5px; font-weight: 600; }
.pot .amount { font-size: 44px; font-weight: 700; line-height: 1.1; }
.pot .what { font-size: 17px; font-weight: 600; margin-top: 6px; }
.player { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.player.turn { background: color-mix(in srgb, var(--secondary-c) 55%, transparent); box-shadow: inset 0 0 0 2px var(--secondary); }
.player.mine { cursor: pointer; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--variant); color: var(--muted);
  display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.turn .avatar { background: var(--primary); color: var(--on-primary); }
.pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pname { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.pname .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { border-radius: 99px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.pri { background: var(--primary); color: var(--on-primary); }
.pill.sec { background: var(--secondary-c); color: var(--on-secondary-c); }
.pill.ter { background: var(--tertiary-c); color: var(--on-tertiary-c); }
.pill.muted { background: var(--variant); color: var(--muted); }
.pill.err { background: var(--error-c); color: var(--on-error-c); }
.pill.dealer { background: var(--secondary); color: var(--on-secondary); }
.money { text-align: right; flex: none; }
.money .bal { font-weight: 700; font-size: 17px; }
.pos { color: var(--primary); } .neg { color: var(--error); }
.offline { color: var(--error); font-size: 12px; font-weight: 600; }
.next-deal { font-weight: 600; margin-top: 6px; }

/* Table view */
.seg { display: flex; border: 1px solid var(--outline); border-radius: 99px; overflow: hidden; flex: none; }
.seg button { flex: 1; background: transparent; color: var(--text); padding: 8px 0; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--outline); }
.seg button.on { background: var(--secondary-c); color: var(--on-secondary-c); }
.tbl { position: relative; width: 100%; flex: none; }
.felt { position: absolute; border-radius: 50%; border: 12px solid #4A2F1B; box-shadow: 0 0 0 2px #2E1C10;
  background: radial-gradient(ellipse at center, #237A51 0%, #15553A 100%); }
.felt::after { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 1.5px solid rgba(242,250,244,.12); }
.tcenter { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #F2FAF4; width: max-content; }
.tcenter .label { font-size: 11px; letter-spacing: 1.5px; font-weight: 600; opacity: .78; }
.tcenter .amount { font-size: 34px; font-weight: 700; line-height: 1.15; }
.tcenter .amount.l { font-size: 28px; }
.tcenter .amount.xl { font-size: 24px; }
.tcenter .dim { font-size: 13px; opacity: .78; }
.tcenter .st { display: inline-block; margin: 0 6px; white-space: nowrap; }
.tcenter .what { font-size: 15px; font-weight: 600; margin-top: 4px; }
.tcenter .next { display: inline-block; margin-top: 6px; background: rgba(0,0,0,.22); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.seat { position: absolute; width: 92px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
.seat[data-act] { cursor: pointer; }
.seat.out { opacity: .5; }
.seat .av { position: relative; width: 42px; height: 42px; margin: 4px; border-radius: 50%; background: var(--card-2); color: var(--text);
  border: 2px solid rgba(46,28,16,.4); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.seat.mine .av { background: var(--primary); color: var(--on-primary); }
.seat.won .av { border-color: var(--primary); }
.seat.turn .av { background: var(--secondary); color: var(--on-secondary); border-color: var(--secondary-c);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--secondary) 35%, transparent); }
.seat .mk { position: absolute; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.seat .mk.d { right: -6px; background: #fff; color: #1B1B1B; }
.seat .mk.bl { left: -6px; font-size: 8px; background: var(--tertiary-c); color: var(--on-tertiary-c); }
.seat .dot { position: absolute; right: -4px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--error); border: 2px solid var(--bg); }
.seat .nm { max-width: 100%; margin-top: 2px; padding: 3px 8px; border-radius: 10px; background: var(--card-2); text-align: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.seat.mine .nm { background: var(--primary-c); color: var(--on-primary-c); }
.seat.won .nm { box-shadow: inset 0 0 0 2px var(--primary), 0 1px 3px rgba(0,0,0,.25); }
.seat.turn .nm { box-shadow: inset 0 0 0 2px var(--secondary), 0 1px 3px rgba(0,0,0,.25); }
.seat .nm .n { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .nm .b { font-size: 12px; font-weight: 700; color: var(--primary); }
.seat.mine .nm .b { color: var(--on-primary-c); }
.seat .pill { margin-top: 3px; font-size: 11px; }
.tbl.compact .seat { width: 80px; }
.tbl.compact .seat .av { width: 36px; height: 36px; font-size: 15px; }

/* Action panel */
.panel { position: sticky; bottom: 0; background: var(--panel); box-shadow: 0 -2px 10px rgba(0,0,0,.15);
  padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
.panel .head { font-weight: 600; }
.winner { color: var(--primary); font-weight: 700; font-size: 17px; text-align: center; }

/* Ledger */
table { width: 100%; border-collapse: collapse; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; padding: 6px 4px; }
td { padding: 9px 4px; text-align: right; border-top: 1px solid var(--outline); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
tfoot td { font-weight: 600; }
.transfer { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.transfer .to { flex: 1; }
h2 { font-size: 17px; margin: 8px 0 0; }
.log { font-size: 13px; color: var(--muted); padding: 2px 0; }
.log.neg { color: var(--error); }

/* Decide winner */
.dialog.wide { max-width: 520px; max-height: calc(100dvh - 32px); overflow-y: auto; gap: 10px; padding: 18px; }
.hand { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 8px 10px; }
.hand.won { background: var(--primary-c); color: var(--on-primary-c); box-shadow: inset 0 0 0 2px var(--primary); }
.hand .hl { flex: 1; min-width: 0; }
.hand .hn { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.hand .del { background: transparent; color: var(--muted); font-size: 18px; padding: 4px; }
.slots { display: flex; gap: 5px; }
.slot { width: 38px; height: 52px; padding: 0; border-radius: 6px; background: #fff; color: #1B1B1B; border: 1px solid var(--outline);
  font-weight: 700; line-height: 1.1; }
.slot.empty { background: var(--variant); color: var(--muted); }
.slot.red, .key.red { color: #C62828; }
.slot.sel { box-shadow: 0 0 0 3px var(--secondary); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.key { min-width: 38px; height: 42px; border-radius: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--outline); font-weight: 700; }
.key.suit { min-width: 52px; font-size: 22px; }
.key.on { background: var(--secondary-c); border: 2px solid var(--secondary); }
.key.plain { border: 0; background: transparent; color: var(--primary); font-weight: 600; }
.verdict { border-radius: 12px; padding: 12px; background: var(--variant); }
.verdict.done { background: var(--primary); color: var(--on-primary); }
.verdict.err { background: var(--error-c); color: var(--on-error-c); }
.verdict .big { font-size: 17px; font-weight: 700; }

/* Dialog and toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
.dialog { background: var(--bg); border-radius: 24px; padding: 22px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { margin: 0; font-size: 20px; font-weight: 500; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog .actions button { background: transparent; color: var(--primary); font-weight: 600; padding: 10px 12px; }
.dialog .actions button.danger { color: var(--error); }
.dialog .menu button { display: block; width: 100%; text-align: left; background: transparent; color: var(--primary); padding: 12px 4px; font-weight: 600; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 520px;
  background: #2C322E; color: #ECF2EC; padding: 14px 16px; border-radius: 8px; z-index: 20; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.spinner { width: 36px; height: 36px; border: 4px solid var(--variant); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
"use strict";
(function () {
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var deviceId = store.get("device");
  if (!deviceId) {
    deviceId = "web-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    store.set("device", deviceId);
  }

  var app = document.getElementById("app");
  var overlay = document.getElementById("overlay");
  var name = store.get("name") || "";
  var status = "join";          // join, connecting, live, reconnecting, closed
  var closedMessage = "";
  var data = null;              // latest WebUpdate from the host
  var tab = "table";
  var view = store.get("view") === "list" ? "list" : "table";   // the Table tab as a drawn table or a list
  var busy = false;
  var es = null;
  var toastTimer = null;
  var dialog = null;            // { kind, ... }
  var raise = { key: "", open: false, amount: 0 };  // poker bet/raise picker

  // Helpers

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function cur() { return data ? data.state.settings.currency : "₹"; }
  function money(n) { return (n < 0 ? "-" : "") + cur() + Math.abs(n); }
  function signed(n) { return n > 0 ? "+" + cur() + n : n < 0 ? "-" + cur() + (-n) : cur() + "0"; }
  function netClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "muted"; }
  function player(s, id) { for (var i = 0; i < s.players.length; i++) if (s.players[i].id === id) return s.players[i]; return null; }
  function nameOf(s, id) { var p = player(s, id); return p ? p.name : "Former player"; }
  function hostName(s) { for (var i = 0; i < s.players.length; i++) if (s.players[i].isHost) return s.players[i].name; return "the host"; }
  function handOf(r, id) { if (!r) return null; for (var i = 0; i < r.hands.length; i++) if (r.hands[i].playerId === id) return r.hands[i]; return null; }
  function isActive(r) { return r && r.phase !== "FINISHED"; }
  function isPoker(s) { return s.settings.game === "POKER"; }
  function word(s) { return isPoker(s) ? "hand" : "round"; }
  function btn(label, act, cls, extra, disabled) {
    return '<button class="btn ' + (cls || "") + '" data-act="' + act + '"' + (extra || "") +
      (disabled || busy ? " disabled" : "") + ">" + label + "</button>";
  }

  // Talking to the host

  function connect() {
    if (es) { es.close(); es = null; }
    status = data ? "reconnecting" : "connecting";
    render();
    es = new EventSource("/events?device=" + encodeURIComponent(deviceId) + "&name=" + encodeURIComponent(name));
    es.addEventListener("update", function (ev) {
      var fresh = JSON.parse(ev.data);
      // Tell this player whenever the host uses undo, so nothing changes behind anyone's back.
      if (data && fresh.state.log.length) {
        var seen = data.state.log.length ? data.state.log[data.state.log.length - 1].seq : 0;
        var undos = fresh.state.log.filter(function (e) { return e.seq > seen && e.kind === "UNDO"; });
        if (undos.length) showToast(undos[undos.length - 1].text);
      }
      data = fresh;
      status = "live";
      store.set("joined", "1");
      render();
    });
    es.addEventListener("goodbye", function (ev) {
      var message = "Disconnected";
      try { message = JSON.parse(ev.data).message; } catch (e) {}
      if (es) { es.close(); es = null; }
      status = "closed";
      closedMessage = message;
      store.del("joined");
      render();
    });
    es.onerror = function () {
      if (status === "closed") return;
      if (status === "live") { status = "reconnecting"; render(); }
      var source = es;
      if (source && source.readyState === 2) {
        setTimeout(function () { if (es === source && status !== "closed") connect(); }, 2000);
      }
    };
  }

  function send(action) {
    if (!data || busy) return;
    busy = true;
    render();
    fetch("/action?device=" + encodeURIComponent(deviceId), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(action)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) showToast(res.error || "That move is not allowed");
    }).catch(function () {
      showToast("Couldn't reach the host");
    }).then(function () { busy = false; render(); });
  }

  function heartbeat() {
    if (status === "live" || status === "reconnecting") {
      fetch("/ping?device=" + encodeURIComponent(deviceId), { method: "POST" }).catch(function () {});
    }
  }
  setInterval(heartbeat, 10000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    heartbeat();
    if ((status === "live" || status === "reconnecting") && (!es || es.readyState === 2)) connect();
  });

  function showToast(text) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = text;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 3500);
  }

  // Screens

  function render() {
    if (status === "join") return renderJoin();
    if (status === "closed") return renderClosed();
    if (!data) return renderConnecting();
    renderGame();
  }

  function logo() {
    return '<div class="fan">' +
      '<div class="pc" style="transform: translateX(-26px) rotate(-16deg)">K<span>♣</span></div>' +
      '<div class="pc red" style="transform: translateY(-4px)">Q<span>♦</span></div>' +
      '<div class="pc" style="transform: translateX(26px) rotate(16deg)">A<span>♠</span></div></div>';
  }

  function renderJoin() {
    document.title = "3 Patti Chips Handler";
    app.innerHTML = '<div class="wrap join">' + logo() +
      "<h1>3 Patti Chips Handler</h1>" +
      '<div class="muted center">Join the table on this WiFi. The host keeps the pot and the ledger.</div>' +
      '<input id="name" class="field" maxlength="20" autocomplete="nickname" autocapitalize="words" placeholder="Your name" value="' + esc(name) + '">' +
      '<div id="nameError" class="small neg" style="display:none">Enter your name first</div>' +
      btn("Join the table", "join") +
      '<div class="small muted center">You need to be on the same WiFi as the host, or on the host\'s hotspot.</div>' +
      '<div class="small muted center">If the host already added you without a phone, use that same name to take over your seat.</div>' +
      '<div class="sig center">Made by Afler</div></div>';
    var input = document.getElementById("name");
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
  }

  function join() {
    var input = document.getElementById("name");
    var value = input ? input.value.trim() : name;
    if (!value) { document.getElementById("nameError").style.display = "block"; return; }
    name = value.slice(0, 20);
    store.set("name", name);
    connect();
  }

  function renderConnecting() {
    app.innerHTML = '<div class="wrap join"><div class="spinner"></div><div class="bold">Joining the table…</div>' +
      '<div class="small muted center">If this takes long, check that you are on the host\'s WiFi or hotspot and that the table is open.</div>' +
      btn("Cancel", "leave", "line") + "</div>";
  }

  function renderClosed() {
    document.title = "3 Patti Chips Handler";
    app.innerHTML = '<div class="wrap join">' + logo() + '<div class="bold center">' + esc(closedMessage) + "</div>" +
      btn("Join again", "leave") + "</div>";
  }

  function renderGame() {
    var u = data, s = u.state, r = s.round;
    var myTurn = r && ((r.phase === "BETTING" && r.turnId === u.playerId) ||
      (r.phase === "SIDE_SHOW_REQUESTED" && r.sideShow && r.sideShow.targetId === u.playerId));
    document.title = myTurn ? "Your turn · 3 Patti Chips" : "3 Patti Chips Handler";
    var html = '<div class="wrap"><header><div class="title">' + esc(s.tableName) + '</div><div class="small muted">Hosted by ' +
      esc(hostName(s)) + "</div></header>";
    if (status === "reconnecting") html += '<div class="banner">Lost the host. Reconnecting…</div>';
    html += '<div class="tabs">' + ["table", "ledger", "history"].map(function (t) {
      return '<button data-act="tab" data-tab="' + t + '" class="' + (tab === t ? "on" : "") + '">' +
        t.charAt(0).toUpperCase() + t.slice(1) + "</button>";
    }).join("") + "</div><main>";
    if (tab === "table") html += tableTab(u);
    else if (tab === "ledger") html += ledgerTab(u);
    else html += historyTab(u);
    html += "</main></div>";
    html += '<div class="panel"><div class="wrap" style="display:flex;flex-direction:column;gap:8px">' + actions(u) + "</div></div>";
    app.innerHTML = html;
  }

  function status0(s, p) {
    var r = s.round, h = handOf(r, p.id);
    var folded = isPoker(s) ? "Folded" : "Packed";
    if (isActive(r) && h) {
      if (h.status === "PACKED") return [folded, "muted"];
      if (h.allIn) return ["All-in", "err"];
      return { BLIND: ["Blind", "sec"], SEEN: ["Seen", "ter"], ACTIVE: ["In", "ter"] }[h.status];
    }
    if (r && !isActive(r) && r.winnerIds.indexOf(p.id) >= 0) return ["Won", "pri"];
    if (r && !isActive(r) && h) return [h.status === "PACKED" ? folded : "Lost", "muted"];
    if (p.sittingOut) return ["Sitting out", "muted"];
    if (isActive(r)) return ["Next " + word(s), "muted"];
    if (isPoker(s) ? p.balance === 0 : p.balance < s.settings.bootAmount) return ["Needs chips", "err"];
    return ["Ready", "muted"];
  }

  function tableTab(u) {
    var html = '<div class="seg">' + ["table", "list"].map(function (v) {
      return '<button data-act="view" data-view="' + v + '" class="' + (view === v ? "on" : "") + '">' +
        (v === "table" ? "Table" : "List") + "</button>";
    }).join("") + "</div>";
    return html + (view === "table" ? tableView(u) : listView(u));
  }

  // n points spread evenly along an oval, starting at the bottom and going clockwise on screen.
  // Spacing is by distance along the edge, so seats don't bunch up.
  function ovalSpots(n, rx, ry) {
    var steps = 720, pts = [], along = [0], i;
    for (i = 0; i <= steps; i++) {
      var t = Math.PI / 2 + 2 * Math.PI * i / steps;
      pts.push([rx * Math.cos(t), ry * Math.sin(t)]);
      if (i > 0) along.push(along[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    var out = [], j = 0;
    for (i = 0; i < n; i++) {
      var target = along[steps] * i / n;
      while (j < steps && along[j] < target) j++;
      out.push(pts[j]);
    }
    return out;
  }

  // The players seated round a card table in turn order. You sit at the bottom and play passes
  // clockwise, so the player after you is on your left.
  function tableView(u) {
    var s = u.state, n = s.players.length, mine = 0, i;
    for (i = 0; i < n; i++) if (s.players[i].id === u.playerId) mine = i;
    var seats = s.players.slice(mine).concat(s.players.slice(0, mine));
    var compact = n > 8, seatW = compact ? 80 : 92, seatH = compact ? 106 : 114;
    var width = Math.min(document.documentElement.clientWidth, 560) - 24;
    var ideal = width * (n <= 4 ? 1.15 : n <= 6 ? 1.2 : n <= 8 ? 1.35 : n <= 10 ? 1.55 : 1.75);
    var least = Math.min(ideal, n <= 4 ? 330 : n <= 6 ? 380 : n <= 8 ? 420 : n <= 10 ? 500 : 580);
    // Shrink to fit above the buttons while the seats still have room.
    var height = Math.round(Math.max(least, Math.min(ideal, window.innerHeight - 340)));
    var rx = (width - seatW) / 2, ry = (height - seatH) / 2, spots = ovalSpots(n, rx, ry);
    var html = '<div class="tbl' + (compact ? " compact" : "") + '" style="height:' + height + 'px">' +
      '<div class="felt" style="left:' + (seatW / 2 - 8) + "px;right:" + (seatW / 2 - 8) + "px;top:" + (seatH / 2 - 8) +
      "px;bottom:" + (seatH / 2 - 8) + 'px"></div>' +
      '<div class="tcenter" style="max-width:' + Math.max(120, Math.round(rx * 2 - seatW - 16)) + 'px">' + tableCentre(u) + "</div>";
    seats.forEach(function (p, k) {
      html += seat(u, p, Math.round(width / 2 + spots[k][0]), Math.round(height / 2 + spots[k][1]));
    });
    return html + "</div>";
  }

  function tableCentre(u) {
    var s = u.state, r = s.round;
    var next = u.nextDealText ? '<div class="next">' + esc(u.nextDealText) + "</div>" : "";
    if (!r) {
      return '<div class="what">' + (isPoker(s) ? "No hand being played" : "No round running") + '</div><div class="dim">' +
        "Everyone starts with " + money(s.settings.startingBalance) + "</div>" + next;
    }
    var W = word(s).toUpperCase(), pot = money(r.pot);
    var html = '<div class="label">' + (isActive(r) ? W + " " + r.number + " · POT" : W + " " + r.number + " FINISHED") + "</div>" +
      '<div class="amount' + (pot.length > 7 ? " xl" : pot.length > 5 ? " l" : "") + '">' + pot + "</div>";
    if (isActive(r)) {
      var stakes = isPoker(s) ? ["Blinds " + money(s.settings.smallBlind) + "/" + money(s.settings.bigBlind)]
        .concat(s.settings.ante > 0 ? ["Ante " + money(s.settings.ante)] : [])
        .concat(r.phase === "BETTING" ? ["Bet " + money(r.currentBet)] : []) :
        ["Blind " + money(r.stake), "Chaal " + money(r.stake * 2)];
      // Each stake wraps as a whole, so a line never ends in a separator.
      html += '<div class="dim">' + stakes.map(function (t) { return '<span class="st">' + t + "</span>"; }).join("") + "</div>";
    }
    return html + '<div class="what">' + esc(u.roundText) + "</div>" + (isActive(r) ? "" : next);
  }

  function seat(u, p, x, y) {
    var s = u.state, r = s.round, h = handOf(r, p.id), mine = p.id === u.playerId;
    var turn = isActive(r) && ((r.phase === "BETTING" && r.turnId === p.id) ||
      (r.phase === "SIDE_SHOW_REQUESTED" && r.sideShow && r.sideShow.targetId === p.id));
    var won = r && !isActive(r) && r.winnerIds.indexOf(p.id) >= 0;
    var out = isActive(r) ? !h || h.status === "PACKED" : p.sittingOut;
    // The status, with the chips put in this round while it runs.
    var st = status0(s, p), label = st[0];
    if (isActive(r) && h && h.status !== "PACKED") {
      if (!isPoker(s)) label += " · " + money(h.invested);
      else if (h.streetBet > 0) label = (h.allIn ? "All-in " : "Bet ") + money(h.streetBet);
    }
    var blind = isActive(r) && isPoker(s) ? (r.smallBlindId === p.id ? "SB" : r.bigBlindId === p.id ? "BB" : "") : "";
    return '<div class="seat' + (turn ? " turn" : "") + (mine ? " mine" : "") + (out ? " out" : "") + (won ? " won" : "") +
      '" style="left:' + x + "px;top:" + y + 'px"' + (mine ? ' data-act="me"' : "") + ">" +
      '<div class="av">' + esc(p.name.charAt(0).toUpperCase()) +
      (isActive(r) && r.dealerId === p.id ? '<span class="mk d">D</span>' : "") +
      (blind ? '<span class="mk bl">' + blind + "</span>" : "") +
      (!p.isHost && p.hasDevice && !p.connected ? '<span class="dot"></span>' : "") + "</div>" +
      '<div class="nm"><div class="n">' + (mine ? "You" : esc(p.name)) + '</div><div class="b">' + money(p.balance) + "</div></div>" +
      '<span class="pill ' + st[1] + '">' + esc(label) + "</span></div>";
  }

  function listView(u) {
    var s = u.state, r = s.round, html = '<div class="card pot">';
    var next = u.nextDealText ? '<div class="next-deal">' + esc(u.nextDealText) + "</div>" : "";
    if (!r) {
      html += '<div class="what">' + (isPoker(s) ? "No hand being played" : "No round running") +
        "</div><div>Everyone starts with " + money(s.settings.startingBalance) +
        '</div><div class="small">' + esc(u.rulesSummary) + "</div>" + next;
    } else {
      var W = word(s).toUpperCase();
      html += '<div class="label">' + (isActive(r) ? W + " " + r.number + " · POT" : W + " " + r.number + " FINISHED") + "</div>" +
        '<div class="amount">' + money(r.pot) + "</div>";
      if (isActive(r) && isPoker(s)) {
        html += "<div>Blinds <b>" + money(s.settings.smallBlind) + "/" + money(s.settings.bigBlind) + "</b>" +
          (s.settings.ante > 0 ? " &nbsp; Ante <b>" + money(s.settings.ante) + "</b>" : "") +
          (r.phase === "BETTING" ? " &nbsp; Bet <b>" + money(r.currentBet) + "</b>" : "") + "</div>";
      } else if (isActive(r)) {
        html += "<div>Blind <b>" + money(r.stake) + "</b> &nbsp; Chaal <b>" + money(r.stake * 2) + "</b></div>";
      }
      html += '<div class="what">' + esc(u.roundText) + "</div>" +
        (isActive(r) ? '<div class="small">Dealer: ' + esc(nameOf(s, r.dealerId)) + "</div>" : next);
    }
    html += "</div>";
    s.players.forEach(function (p) {
      var h = handOf(r, p.id), mine = p.id === u.playerId;
      var turn = isActive(r) && ((r.phase === "BETTING" && r.turnId === p.id) ||
        (r.phase === "SIDE_SHOW_REQUESTED" && r.sideShow && r.sideShow.targetId === p.id));
      var st = status0(s, p), net = p.balance - p.buyIn;
      html += '<div class="card player' + (turn ? " turn" : "") + (mine ? " mine" : "") + '"' + (mine ? ' data-act="me"' : "") + ">" +
        '<div class="avatar">' + esc(p.name.charAt(0).toUpperCase()) + "</div>" +
        '<div class="pinfo"><div class="pname"><span class="n">' + esc(p.name) + (mine ? " (you)" : "") + "</span>" +
        (isActive(r) && r.dealerId === p.id ? '<span class="pill dealer">' + (isPoker(s) ? "D" : "Dealer") + "</span>" : "") +
        (isActive(r) && isPoker(s) && r.smallBlindId === p.id ? '<span class="pill ter">SB</span>' : "") +
        (isActive(r) && isPoker(s) && r.bigBlindId === p.id ? '<span class="pill ter">BB</span>' : "") +
        (p.isHost ? '<span class="pill muted">Host</span>' : "") + "</div>" +
        '<div><span class="pill ' + st[1] + '">' + st[0] + "</span>" +
        (isActive(r) && h && h.invested > 0 ? ' <span class="small muted">' +
          (isPoker(s) && h.streetBet > 0 ? "bet " + money(h.streetBet) + " · " : "") + "in pot " + money(h.invested) + "</span>" : "") +
        "</div>" +
        (!p.hasDevice ? '<div class="small muted">No phone · host plays for them</div>' :
          !p.isHost && !p.connected ? '<div class="offline">Offline' + (p.onBrowser ? " · in browser" : "") + "</div>" :
          p.onBrowser ? '<div class="small muted">In browser</div>' : "") +
        '</div><div class="money"><div class="bal">' + money(p.balance) + '</div><div class="small ' + netClass(net) + '">' +
        signed(net) + "</div></div></div>";
    });
    return html;
  }

  function ledgerTab(u) {
    var s = u.state, r = s.round;
    var html = '<div class="card"><table><thead><tr><th>Player</th><th>Bought</th><th>Chips</th><th>Net</th></tr></thead><tbody>';
    var bought = 0, chips = 0;
    s.players.forEach(function (p) {
      var net = p.balance - p.buyIn;
      bought += p.buyIn; chips += p.balance;
      html += "<tr><td>" + esc(p.name) + (p.id === u.playerId ? " (you)" : "") + '</td><td class="muted">' + money(p.buyIn) +
        "</td><td>" + money(p.balance) + '</td><td class="bold ' + netClass(net) + '">' + signed(net) + "</td></tr>";
    });
    html += "</tbody><tfoot><tr><td>Total</td><td>" + money(bought) + "</td><td>" + money(chips) + "</td><td></td></tr></tfoot></table></div>";
    if (isActive(r)) html += '<div class="small muted">' + money(r.pot) + " is in the pot of the running round. Settle up after it ends.</div>";
    html += "<h2>Settle up</h2>";
    if (!u.transfers.length) html += '<div class="muted">Everyone is even. Nobody owes anything.</div>';
    u.transfers.forEach(function (t) {
      html += '<div class="card transfer"><span>' + esc(nameOf(s, t.fromId)) + '</span><span class="muted">→</span><span class="to">' +
        esc(nameOf(s, t.toId)) + '</span><span class="bold">' + money(t.amount) + "</span></div>";
    });
    html += '<div class="small muted">Bought = starting chips plus top ups, minus cash outs. Net = chips now minus bought.</div>';
    return html;
  }

  function historyTab(u) {
    var s = u.state, Word = word(s).charAt(0).toUpperCase() + word(s).slice(1), html = "";
    if (s.undoCount > 0) {
      html += '<div class="card" style="background:var(--error-c);color:var(--on-error-c)">The host used undo ' + s.undoCount +
        (s.undoCount === 1 ? " time" : " times") + ". Undone moves stay below, crossed out.</div>";
    }
    html += "<h2>" + Word + "s</h2>";
    if (!s.results.length) html += '<div class="muted">No ' + word(s) + "s finished yet.</div>";
    s.results.slice().reverse().forEach(function (res) {
      var changes = Object.keys(res.changes).map(function (id) { return [id, res.changes[id]]; })
        .sort(function (a, b) { return b[1] - a[1]; })
        .map(function (c) { return esc(nameOf(s, c[0])) + ' <b class="' + netClass(c[1]) + '">' + signed(c[1]) + "</b>"; }).join(" &nbsp; ");
      var strike = res.undone ? ' style="text-decoration:line-through;opacity:.6"' : "";
      html += '<div class="card"><div class="row"><b>' + Word + " " + res.number + "</b>" +
        (res.undone ? '<span><span class="pill err">Undone by host</span></span>' : "") +
        '<span style="text-align:right"' + strike + ">Pot " + money(res.pot) +
        "</span></div><div class=\"pos bold\"" + strike + ">" + (res.winnerNames.length === 1 ? "Winner: " : "Split between: ") +
        esc(res.winnerNames.join(", ")) + '</div><div class="small"' + strike + ">" + changes + "</div>" +
        (res.undone ? '<div class="small muted">Not counted: the chips went back to how they were before this result.</div>' : "") +
        "</div>";
    });
    html += "<h2>Table log</h2>";
    s.log.slice().reverse().forEach(function (e) {
      if (e.kind === "UNDO") html += '<div class="log neg bold">' + esc(e.text) + "</div>";
      else if (e.undone) html += '<div class="log" style="text-decoration:line-through;opacity:.6">' + esc(e.text) + " (undone)</div>";
      else html += '<div class="log">' + esc(e.text) + "</div>";
    });
    return html;
  }

  function actions(u) {
    var s = u.state, r = s.round, o = u.options, me = u.playerId;
    if (!r || r.phase === "FINISHED") {
      return (r ? '<div class="winner">' + esc(u.roundText) + "</div>" : "") +
        '<div class="center" style="padding:6px 0">Waiting for ' + esc(hostName(s)) + " to start the " + (r ? "next " : "") + word(s) + "</div>";
    }
    if (isPoker(s)) return pokerActions(u);
    var me0 = player(s, me);
    var summary = o.inRound && me0 ? money(me0.balance) + " left · " + (o.isPacked ? "packed" : o.isBlind ? "blind" : "seen") : "";
    if (r.phase === "BETTING") {
      var html = '<div><div class="head">' + (o.isTurn ? "Your turn" : "Waiting for " + esc(nameOf(s, r.turnId))) +
        '</div><div class="small muted">' + summary + "</div></div>";
      if (!o.inRound) return html + '<div class="small muted">You are not in this round. You\'ll be dealt in next round.</div>';
      if (o.isPacked) return html + '<div class="small muted">You packed. Wait for the next round.</div>';
      if (o.isTurn) {
        html += '<div class="row">' +
          btn(o.callLabel + "<b>" + money(o.callAmount) + "</b>", "bet", "big", "", o.callError != null) +
          btn("Raise<b>" + money(o.raiseAmount) + "</b>", "raise", "big alt", "", o.raiseError != null) + "</div>";
        html += '<div class="row">' +
          (o.canSee ? btn("See cards", "see", "line slim") : "") +
          (o.showAvailable ? btn("Show " + money(o.showAmount), "show", "line slim", "", o.showError != null) : "") +
          (o.sideShowAvailable ? btn("Side show", "sideshow", "line slim", "", o.sideShowError != null) : "") +
          btn("Pack", "pack", "danger slim") + "</div>";
        var note = o.callError || (o.raiseError && o.raiseError.indexOf("needs") < 0 ? o.raiseError : null) ||
          (o.sideShowAvailable ? (o.sideShowError || "Side show: pay " + money(o.sideShowAmount) +
            " and compare cards with " + nameOf(s, o.sideShowTargetId)) : null);
        if (note) html += '<div class="small muted">' + esc(note) + "</div>";
        return html;
      }
      return html + '<div class="row">' + (o.canSee ? btn("See cards", "see", "line slim") : "") + btn("Pack", "pack", "danger slim") + "</div>";
    }
    var ss = r.sideShow;
    if (r.phase === "SIDE_SHOW_REQUESTED" && ss) {
      if (o.answerSideShowFrom) {
        return '<div class="head">' + esc(nameOf(s, ss.requesterId)) + " asks you for a side show</div>" +
          '<div class="small muted">If you accept, you both compare cards privately and the weaker hand packs. The host enters the result.</div>' +
          '<div class="row">' + btn("Refuse", "refuse", "line") + btn("Accept", "accept") + "</div>";
      }
      return '<div class="head">Waiting for ' + esc(nameOf(s, ss.targetId)) + " to answer " + esc(nameOf(s, ss.requesterId)) + "'s side show</div>";
    }
    var decide = btn("Not sure? Decide from the cards", "decide", "line slim");
    if (r.phase === "SIDE_SHOW_COMPARE" && ss) {
      return '<div class="head">' + esc(nameOf(s, ss.requesterId)) + " and " + esc(nameOf(s, ss.targetId)) + " are comparing cards</div>" +
        '<div class="small muted">Waiting for the host to enter who won the side show</div>' + decide;
    }
    return '<div class="head">Show: ' + esc(r.showdownIds.map(function (id) { return nameOf(s, id); }).join(" vs ")) + "</div>" +
      '<div class="small muted">Cards are on the table. Waiting for the host to enter the winner.</div>' + decide;
  }

  // Decide winner: players enter everyone's 3 cards and the host's phone ranks the hands.

  var SUITS = [["S", "♠"], ["H", "♥"], ["D", "♦"], ["C", "♣"]];
  function rankText(r) { return { 14: "A", 13: "K", 12: "Q", 11: "J" }[r] || String(r); }
  function cardCode(c) { return rankText(c.r) + c.s; }
  function isRed(s) { return s === "H" || s === "D"; }

  function openDecide(title, labels, asker, canAdd) {
    openDialog({
      kind: "decide", title: title, labels: labels, asker: asker, canAdd: canAdd, slot: [0, 0], rank: null, suit: null,
      cards: labels.map(function () { return [null, null, null]; }), result: null, asked: 0
    });
  }

  // Cards on the table, except the one in the selected slot, which can be swapped.
  function usedCards(d) {
    var used = {};
    d.cards.forEach(function (hand, i) {
      hand.forEach(function (c, j) { if (c && !(i === d.slot[0] && j === d.slot[1])) used[cardCode(c)] = true; });
    });
    return used;
  }

  function firstEmpty(d) {
    for (var i = 0; i < d.cards.length; i++) {
      var j = d.cards[i].indexOf(null);
      if (j >= 0) return [i, j];
    }
    return null;
  }

  function placeCard(d, card) {
    d.cards[d.slot[0]][d.slot[1]] = card;
    d.rank = null; d.suit = null;
    d.slot = firstEmpty(d) || d.slot;
    askVerdict(d);
  }

  function askVerdict(d) {
    var asked = ++d.asked;
    var body = { hands: d.cards.map(function (h) { return h.filter(Boolean).map(cardCode); }), sideShowAsker: d.asker };
    fetch("/compare", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (dialog === d && asked === d.asked) { d.result = res; renderDialog(); } })
      .catch(function () { showToast("Couldn't reach the host"); });
    renderDialog();
  }

  function decideBody(d) {
    var res = d.result || {}, names = res.names || [], winners = res.winners || [], used = usedCards(d);
    var html = "<h3>" + esc(d.title) + '</h3><div class="small muted">Tap a card, then pick its rank and suit. ' +
      "The app ranks the hands by 3 Patti rules.</div>";
    d.cards.forEach(function (hand, i) {
      var won = winners.indexOf(i) >= 0, missing = hand.filter(function (c) { return !c; }).length;
      html += '<div class="hand' + (won ? " won" : "") + '"><div class="hl"><div class="hn">' + esc(d.labels[i]) +
        (won ? ' <span class="pill pri">Wins</span>' : "") + '</div><div class="small">' +
        (missing ? '<span class="muted">' + missing + " to enter</span>" : '<b>' + esc(names[i] || "") + "</b>") + '</div></div><div class="slots">';
      hand.forEach(function (c, j) {
        var sel = d.slot[0] === i && d.slot[1] === j;
        html += '<button class="slot' + (c ? (isRed(c.s) ? " red" : "") : " empty") + (sel ? " sel" : "") +
          '" data-act="slot" data-i="' + i + '" data-j="' + j + '">' +
          (c ? rankText(c.r) + "<br>" + SUITS.filter(function (x) { return x[0] === c.s; })[0][1] : "?") + "</button>";
      });
      html += "</div>" + (d.canAdd && d.cards.length > 2 ? '<button class="del" data-act="delhand" data-i="' + i + '" aria-label="Remove">✕</button>' : "") + "</div>";
    });
    if (d.canAdd && d.cards.length < 6) html += '<button class="key plain" data-act="addhand">Add a hand</button>';
    var complete = d.cards.every(function (h) { return h.every(Boolean); });
    if (res.ok === false && complete) html += '<div class="verdict err bold">' + esc(res.error) + "</div>";
    else if (complete && winners.length) {
      var who = winners.map(function (i) { return d.labels[i]; });
      html += '<div class="verdict done"><div class="big">' + esc(who.length === 1 ? who[0] + " wins" : who.join(" and ") + " tie") +
        "</div><div>" + esc(names[winners[0]]) + "</div>" + (res.note ? '<div class="small">' + esc(res.note) + "</div>" : "") + "</div>";
    } else html += '<div class="verdict muted">Enter every card to see who wins.</div>';
    html += '<div class="keys">';
    for (var r = 14; r >= 2; r--) {
      var free = SUITS.some(function (x) { return !used[rankText(r) + x[0]]; }) && (!d.suit || !used[rankText(r) + d.suit]);
      html += '<button class="key' + (d.rank === r ? " on" : "") + '" data-act="rank" data-r="' + r + '"' + (free ? "" : " disabled") + ">" + rankText(r) + "</button>";
    }
    html += '</div><div class="keys">';
    SUITS.forEach(function (x) {
      var free = !d.rank || !used[rankText(d.rank) + x[0]];
      html += '<button class="key suit' + (isRed(x[0]) ? " red" : "") + (d.suit === x[0] ? " on" : "") + '" data-act="suit" data-s="' + x[0] + '"' +
        (free ? "" : " disabled") + ">" + x[1] + "</button>";
    });
    var current = d.cards[d.slot[0]] && d.cards[d.slot[0]][d.slot[1]];
    html += '<button class="key plain" data-act="clearcard"' + (current ? "" : " disabled") + ">Clear</button></div>" +
      '<div class="actions"><button data-act="close">Close</button></div>';
    return html;
  }

  function pokerActions(u) {
    var s = u.state, r = s.round, o = u.poker;
    if (r.phase !== "BETTING") {
      var i = r.potWinners.length, pot = r.pots[i];
      return '<div class="head">' + esc(u.roundText) + "</div>" +
        '<div class="small muted">Cards are on the table. Waiting for the host to enter who won' + (r.pots.length > 1 ? " each pot" : "") + ".</div>";
    }
    var html = '<div><div class="head">' + (o.isTurn ? "Your turn" : "Waiting for " + esc(nameOf(s, r.turnId))) + "</div>" +
      (o.inHand ? '<div class="small muted">' + money(o.stack) + " left" + (o.streetBet > 0 ? " · bet " + money(o.streetBet) : "") + "</div>" : "") +
      "</div>";
    if (!o.inHand) return html + '<div class="small muted">You are not in this hand. You\'ll be dealt in next hand.</div>';
    if (o.folded) return html + '<div class="small muted">You folded. Wait for the next hand.</div>';
    if (o.allIn) return html + '<div class="small muted">You are all-in. Wait for the showdown.</div>';
    if (!o.isTurn) return html + '<div class="row">' + btn("Fold", "pack", "danger slim") + "</div>";
    var key = r.number + ":" + r.street + ":" + o.minRaiseTo + ":" + o.maxRaiseTo;
    if (raise.key !== key) raise = { key: key, open: false, amount: o.minRaiseTo };
    if (raise.open && o.canRaise) {
      var allInTo = o.streetBet + o.stack, verb = o.isBet ? "Bet " : "Raise to ";
      if (o.maxRaiseTo > o.minRaiseTo) {
        html += '<input id="raiseRange" type="range" min="' + o.minRaiseTo + '" max="' + o.maxRaiseTo + '" step="1" value="' +
          raise.amount + '" style="width:100%;accent-color:var(--secondary)">';
        var quick = [["Min", o.minRaiseTo], ["½ pot", o.halfPotRaiseTo], ["Pot", o.potRaiseTo], [o.maxRaiseTo === allInTo ? "All-in" : "Max", o.maxRaiseTo]];
        var seen = {};
        html += '<div class="row">' + quick.filter(function (q) { if (seen[q[1]]) return false; seen[q[1]] = true; return true; }).map(function (q) {
          return btn(q[0], "quick", "line slim", ' data-amount="' + q[1] + '"');
        }).join("") + "</div>";
      }
      html += '<div class="row">' + btn("Back", "raiseBack", "line") +
        '<button class="btn alt" data-act="raiseGo" style="flex:2" id="raiseGo"' + (busy ? " disabled" : "") + ">" +
        verb + money(raise.amount) + (raise.amount === allInTo ? " all-in" : "") + "</button></div>";
      return html;
    }
    html += '<div class="row">' + btn("Fold", "pack", "danger slim");
    if (o.canCheck) html += btn("Check", "check", "big");
    if (o.canCall) html += btn((o.callIsAllIn ? "Call all-in" : "Call") + "<b>" + money(o.toCall) + "</b>", "call", "big");
    if (o.canRaise) {
      html += btn((o.isBet ? "Bet" : "Raise") + "<b>" + money(o.minRaiseTo) + (o.maxRaiseTo > o.minRaiseTo ? "+" : "") + "</b>", "raiseOpen", "big alt");
    }
    return html + "</div>";
  }

  function raiseLabel() {
    var o = data.poker, allInTo = o.streetBet + o.stack;
    return (o.isBet ? "Bet " : "Raise to ") + money(raise.amount) + (raise.amount === allInTo ? " all-in" : "");
  }

  document.addEventListener("input", function (e) {
    if (e.target.id !== "raiseRange") return;
    var o = data.poker, value = parseInt(e.target.value, 10), step = Math.max(1, data.state.settings.bigBlind);
    var snapped = o.minRaiseTo + Math.round((value - o.minRaiseTo) / step) * step;
    raise.amount = value >= o.maxRaiseTo - step / 2 ? o.maxRaiseTo : Math.min(o.maxRaiseTo, Math.max(o.minRaiseTo, snapped));
    var go = document.getElementById("raiseGo");
    if (go) go.textContent = raiseLabel();
  });

  // Dialogs

  function openDialog(d) { dialog = d; renderDialog(); }
  function closeDialog() { dialog = null; overlay.innerHTML = ""; }
  function renderDialog() {
    if (!dialog) { overlay.innerHTML = ""; return; }
    var body = "";
    if (dialog.kind === "confirm") {
      body = "<h3>" + esc(dialog.title) + "</h3><div>" + esc(dialog.text) + '</div><div class="actions">' +
        '<button data-act="close">Cancel</button><button data-act="confirm" class="' + (dialog.danger ? "danger" : "") + '">' +
        esc(dialog.label) + "</button></div>";
    } else if (dialog.kind === "me") {
      var p = data && player(data.state, data.playerId);
      if (!p) return closeDialog();
      body = "<h3>" + esc(p.name) + " (you)</h3>" +
        '<div class="small muted">Chips ' + money(p.balance) + " · bought " + money(p.buyIn) + " · " + signed(p.balance - p.buyIn) + "</div>" +
        '<div class="menu"><button data-act="rename">Rename</button><button data-act="sitout">' +
        (p.sittingOut ? "Sit back in" : "Sit out from next " + word(data.state)) + '</button><button data-act="rules">Table rules</button>' +
        (isPoker(data.state) ? "" : '<button data-act="checker">Which hand wins?</button>') + "</div>" +
        '<div class="actions"><button data-act="close">Close</button></div>';
    } else if (dialog.kind === "decide") {
      body = decideBody(dialog);
    } else if (dialog.kind === "rename") {
      body = '<h3>Rename</h3><input id="newName" class="field" maxlength="20" value="' + esc(name) + '">' +
        '<div class="actions"><button data-act="close">Cancel</button><button data-act="saveName">Save</button></div>';
    } else if (dialog.kind === "rules") {
      var set = data.state.settings;
      body = "<h3>Table rules</h3><div class=\"bold\">" + esc(data.rulesSummary) + '</div><div class="small muted">' + (isPoker(data.state) ?
        "• The two players after the dealer post the blinds, " + money(set.smallBlind) + " and " + money(set.bigBlind) + ". The dealer button moves one seat every hand.<br>" +
        (set.ante > 0 ? (set.anteStyle === "BIG_BLIND" ? "• The big blind also pays an ante of " + money(set.ante) + " for every player." :
          "• Everyone antes " + money(set.ante) + " before the blinds.") + " Antes go into the pot but don't count as a bet.<br>" : "") +
        "• Betting goes round four times: before the flop, after the flop, on the turn and on the river.<br>" +
        "• Check, call, bet or raise. A raise must be at least as big as the last bet or raise.<br>" +
        (set.betLimit === "POT_LIMIT" ? "• Pot limit: the most you can bet or raise is the size of the pot.<br>" : "• No limit: you can bet any amount up to all your chips.<br>") +
        "• An all-in player can only win what they matched from each other player. The app works out the side pots.<br>" +
        "• At showdown the host taps who won each pot.</div>" : "") + (isPoker(data.state) ? "" :
        "• Every round starts with a boot of " + money(set.bootAmount) + " from each player. The stake starts at the boot.<br>" +
        "• The winner of a round deals the next one, so the player after the winner goes first.<br>" +
        "• Blind players bet the stake. Seen players bet twice the stake (chaal).<br>" +
        "• Raise doubles the stake for everyone after you.<br>" +
        "• Side show: a seen player can ask the previous seen player to compare cards privately. The weaker hand packs.<br>" +
        "• Show: when 2 players are left, either can pay one bet to show. The host enters who won.<br>" +
        "• Hands from best: trail, pure sequence, sequence, color, pair, high card. A-K-Q is the top sequence, then A-2-3.</div>") +
        '<div class="sig">Made by Afler</div><div class="actions"><button data-act="close">OK</button></div>';
    }
    overlay.innerHTML = '<div class="scrim" data-act="scrim"><div class="dialog' + (dialog.kind === "decide" ? " wide" : "") + '">' + body + "</div></div>";
    var input = document.getElementById("newName");
    if (input) input.focus();
  }

  // Taps

  // The drawn table is sized to the screen, so draw it again when the width changes (the phone turns).
  // Height changes are ignored: on Android the keyboard opening changes it.
  var drawnWidth = document.documentElement.clientWidth;
  window.addEventListener("resize", function () {
    var w = document.documentElement.clientWidth;
    if (w === drawnWidth) return;
    drawnWidth = w;
    if (data && (status === "live" || status === "reconnecting")) render();
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    var me = data ? data.playerId : null;
    var o = data ? data.options : null;
    switch (act) {
      case "join": join(); break;
      case "leave": if (es) { es.close(); es = null; } status = "join"; data = null; store.del("joined"); render(); break;
      case "tab": tab = el.getAttribute("data-tab"); render(); window.scrollTo(0, 0); break;
      case "view": view = el.getAttribute("data-view"); store.set("view", view); render(); break;
      case "bet": send({ type: "bet", playerId: me, raise: false }); break;
      case "raise": send({ type: "bet", playerId: me, raise: true }); break;
      case "see": send({ type: "see", playerId: me }); break;
      case "show": send({ type: "show", playerId: me }); break;
      case "sideshow": send({ type: "side_show", playerId: me }); break;
      case "accept": send({ type: "side_show_answer", playerId: me, accept: true }); break;
      case "refuse": send({ type: "side_show_answer", playerId: me, accept: false }); break;
      case "pack":
        var h = handOf(data.state.round, me), verb = isPoker(data.state) ? "Fold" : "Pack";
        openDialog({ kind: "confirm", title: verb + " your hand?", text: "The " + money(h ? h.invested : 0) + " already in the pot stays there.",
          label: verb, danger: true, action: { type: "pack", playerId: me } });
        break;
      case "check": send({ type: "check", playerId: me }); break;
      case "call": send({ type: "call", playerId: me }); break;
      case "raiseOpen": raise.open = true; raise.amount = data.poker.minRaiseTo; render(); break;
      case "raiseBack": raise.open = false; render(); break;
      case "quick": raise.amount = parseInt(el.getAttribute("data-amount"), 10); render(); break;
      case "raiseGo": raise.open = false; send({ type: "raise_to", playerId: me, amount: raise.amount }); break;
      case "me": openDialog({ kind: "me" }); break;
      case "rename": openDialog({ kind: "rename" }); break;
      case "rules": openDialog({ kind: "rules" }); break;
      case "saveName":
        var v = document.getElementById("newName").value.trim();
        if (v) { name = v.slice(0, 20); store.set("name", name); send({ type: "rename", playerId: me, name: name }); }
        closeDialog();
        break;
      case "sitout":
        var p = player(data.state, me);
        send({ type: "sit_out", playerId: me, sittingOut: !(p && p.sittingOut) });
        closeDialog();
        break;
      case "confirm": var a = dialog && dialog.action; closeDialog(); if (a) send(a); break;
      case "close": closeDialog(); break;
      case "decide":
        var rd = data.state.round, sd = rd && rd.phase === "SIDE_SHOW_COMPARE" ? rd.sideShow : null;
        var ids = sd ? [sd.requesterId, sd.targetId] : rd ? rd.showdownIds : [];
        openDecide(sd ? "Decide the side show" : "Decide the show", ids.map(function (id) { return nameOf(data.state, id); }), sd ? 0 : null, false);
        break;
      case "checker": openDecide("Which hand wins?", ["Hand 1", "Hand 2"], null, true); break;
      case "slot": dialog.slot = [+el.getAttribute("data-i"), +el.getAttribute("data-j")]; dialog.rank = null; dialog.suit = null; renderDialog(); break;
      case "rank":
        var rk = +el.getAttribute("data-r");
        if (dialog.suit) placeCard(dialog, { r: rk, s: dialog.suit }); else { dialog.rank = dialog.rank === rk ? null : rk; renderDialog(); }
        break;
      case "suit":
        var su = el.getAttribute("data-s");
        if (dialog.rank) placeCard(dialog, { r: dialog.rank, s: su }); else { dialog.suit = dialog.suit === su ? null : su; renderDialog(); }
        break;
      case "clearcard": dialog.cards[dialog.slot[0]][dialog.slot[1]] = null; dialog.rank = null; dialog.suit = null; askVerdict(dialog); break;
      case "addhand":
        dialog.labels.push("Hand " + (dialog.labels.length + 1)); dialog.cards.push([null, null, null]);
        dialog.slot = firstEmpty(dialog); askVerdict(dialog);
        break;
      case "delhand":
        var di = +el.getAttribute("data-i");
        dialog.labels.splice(di, 1); dialog.cards.splice(di, 1);
        dialog.labels = dialog.labels.map(function (l, k) { return "Hand " + (k + 1); });
        dialog.slot = firstEmpty(dialog) || [0, 0]; askVerdict(dialog);
        break;
      case "scrim": if (e.target === el) closeDialog(); break;
    }
  });

  if (name && store.get("joined")) connect(); else render();
})();
</script>
</body>
</html>
