name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game and network tests
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk 3patti-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 3patti-tracker-apk
          path: 3patti-tracker.apk

      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest 3patti-tracker.apk \
            --title "3 Patti Tracker (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}. Download 3patti-tracker.apk on every phone and install it." \
            --target "$GITHUB_SHA" \
            --latest
